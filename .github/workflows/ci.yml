name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "24.10.4"

      - name: Install nf-core tools
        run: pip install nf-core

      - name: Lint parameter schema (JSON)
        run: nf-core pipelines schema lint .

      - name: Validate example params file against schema
        run: nf-core pipelines schema validate . assets/params.example.yaml

      - name: Print resolved test profile config
        run: nextflow config -profile test

      - name: Pipeline help (nf-schema)
        run: nextflow run . --help
