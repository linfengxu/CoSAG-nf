# Example parameter file for linfengxu/CoSAG-nf
# Usage: nextflow run linfengxu/CoSAG-nf -profile singularity -params-file assets/params.example.yaml

input: '/path/to/samples.tsv'
outdir: '/path/to/results'

# Required databases
checkm2_db: '/path/to/checkm2_database/uniref100.KO.1.dmnd'
gtdb_database: '/path/to/gtdbtk_r220_data'

# Co-assembly rounds
cosag_rounds: 1          # internal rounds 1–3
round: 1                 # 2 = second sourmash pass on R1 co-assembly contigs → <outdir>/round2/
# sourmash_ksize: 31     # optional: often better for SAG-level clustering than default 51

# Quality thresholds
min_completeness: 50
max_contamination: 10
cosag_optimize: true

# SPAdes
spades_kmers: '21,33,55'
spades_sc: true
spades_careful: true

# Clustering (SciPy hierarchical clustering on Sourmash distances)
sourmash_ksize: 51
cluster_linkage_method: complete
cluster_criterion: inconsistent
cluster_threshold: 0.95
cluster_min_size: 2
